name: Android Signed APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare memory for R8
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory before swap:"
          free -h

          # GitHub-hosted runners have limited RAM. A small swap file prevents the
          # operating system from killing Gradle while R8 is processing this large app.
          if ! swapon --show | grep -q .; then
            if sudo fallocate -l 4G /swapfile \
              && sudo chmod 600 /swapfile \
              && sudo mkswap /swapfile >/dev/null \
              && sudo swapon /swapfile; then
              echo "4 GB swap enabled."
            else
              echo "::warning::Unable to enable swap; continuing with the 5 GB Gradle heap."
            fi
          fi

          echo "Memory after swap:"
          free -h
          swapon --show || true

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore fixed signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/talkami-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Create application and build version
        shell: bash
        run: |
          set -euo pipefail
          printf 'applicationId=com.test.ts\n' > local.properties

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Build version: $VERSION_NAME ($VERSION_CODE)"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build fixed-signature release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Do not run clean on a fresh hosted runner. It only adds work and peak memory.
          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            --max-workers=2

      - name: Verify and rename signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          OUTPUT_APK="app/build/outputs/apk/release/Talkami-${VERSION_NAME}-${VERSION_CODE}-arm32-arm64.apk"
          if [ "$APK_PATH" != "$OUTPUT_APK" ]; then
            cp "$APK_PATH" "$OUTPUT_APK"
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$OUTPUT_APK"

          echo "SIGNED_APK=$OUTPUT_APK" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkami-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Talkami-mapping-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

# Project-wide Gradle settings.
# Large multi-module release builds run R8 inside the Gradle JVM.
# The previous 2048 MB heap was not enough and caused :app:minifyReleaseWithR8 to fail.
org.gradle.jvmargs=-Xms512m -Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Keep memory usage predictable on GitHub-hosted runners.
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8

# This is a large legacy Android project. R8 compatibility mode uses less aggressive
# whole-program optimisation and is safer for reflection-heavy third-party SDKs.
android.enableR8.fullMode=false

android.useAndroidX=true
android.enableJetifier=true
android.injected.testOnly=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
apmsInstrumentationEnabled=false

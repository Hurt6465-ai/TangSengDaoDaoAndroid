apply plugin: 'com.android.library'

android {
    namespace 'com.chat.partnerlist'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }
}

dependencies {
    api project(':wkbase')
    implementation project(':wkuikit')
    // Reuse the profile module's canonical tag-key localization instead of
    // rendering backend keys such as goal_study_abroad in the list.
    implementation project(':wkpartner')
}

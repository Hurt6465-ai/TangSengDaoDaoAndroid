apply plugin: 'com.android.library'

android {
    namespace 'com.chat.learning'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // LearningFragment extends androidx.fragment.app.Fragment, so wklearning must declare
    // the AndroidX dependency itself. Do not rely on transitive dependencies from wkuikit.
    api 'androidx.appcompat:appcompat:1.7.0'

    // LearningFragment opens AiScriptWebActivity and ScriptManagerActivity.
    api project(':wkuserscript')
}
